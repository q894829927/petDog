name: Test and package PetDog API

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Package API release
        if: github.event_name != 'pull_request'
        run: |
          printf '%s\n' "$GITHUB_SHA" > .source-sha
          tar -czf "$RUNNER_TEMP/petdog-api.tar.gz" dist migrations deploy package.json package-lock.json .source-sha
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: petdog-api-${{ github.sha }}
          path: ${{ runner.temp }}/petdog-api.tar.gz
          if-no-files-found: error
